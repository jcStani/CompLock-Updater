# Builds CompLock.exe on Windows and publishes it as a release when a version tag is pushed (v1, v2, ...).
# The release holds the exe itself. deadlockconfig.com links to releases/latest, so the newest release is what people get.
# The tag has to match AppVersion in src/Core.cs.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag against AppVersion
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $m = [regex]::Match((Get-Content src/Core.cs -Raw), 'AppVersion\s*=\s*(\d+)')
          if (-not $m.Success) { throw "AppVersion not found in src/Core.cs" }
          if ("v$($m.Groups[1].Value)" -ne $env:TAG) { throw "tag $env:TAG, but AppVersion is $($m.Groups[1].Value)" }
      - name: Build
        shell: powershell
        run: ./build.ps1
      - name: Publish the release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $exe = (Get-FileHash CompLock.exe -Algorithm SHA256).Hash.ToLower()
          $notes = @(
            "Download CompLock.exe below and run it. There is nothing to install."
            ""
            "The exe is not signed, so Windows SmartScreen warns the first time it runs: More info, then Run anyway."
            ""
            "![The CompLock Updater window](https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:TAG/screenshot.png)"
            ""
            "SHA-256 of CompLock.exe: ``$exe``"
          ) -join "`n"
          gh release create $env:TAG CompLock.exe --repo $env:GITHUB_REPOSITORY --title "CompLock Updater $env:TAG" --notes $notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
